name: usps_v3_dart
description: A strongly-typed Dart SDK for USPS REST APIs (v3), supporting OAuth 2.0, package tracking, address validation, locations, rates, and shipping.
version: 1.2.0
repository: https://github.com/Cesarius1970/usps_v3_dart
issue_tracker: https://github.com/Cesarius1970/usps_v3_dart/issues
topics:
  - usps
  - shipping
  - tracking
  - postal
  - rest-api

environment:
  sdk: ^3.12.2

# Production runtime dependencies
dependencies:
  # Cryptographic utilities for HMAC webhook signature verification
  crypto: ^3.0.7
  # HTTP client for composing requests and interceptors
  dio: ^5.11.1
  # Annotations for code-generation of JSON serialization
  json_annotation: ^4.12.0

# Development, build, and test tooling
dev_dependencies:
  # Code generation runner for JSON serializers
  build_runner: ^2.16.1
  # Code coverage data collector and LCOV generator
  coverage: ^1.15.0
  # Generator for json_annotation models
  json_serializable: ^6.14.1
  # Official Dart lint rules recommended for packages
  lints: ^6.0.0
  # Mocking library for unit and integration testing
  mocktail: ^1.0.5
  # Official Dart test framework
  test: ^1.32.0
